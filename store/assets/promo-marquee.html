<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="../../content/letterboxd.css" />
    <style>
      .tile {
        position: relative;
        width: 1400px;
        height: 560px;
        overflow: hidden;
        background:
          radial-gradient(760px 520px at 92% -10%, rgba(255, 69, 87, 0.28), transparent 65%),
          radial-gradient(640px 420px at -5% 110%, rgba(255, 165, 61, 0.16), transparent 65%),
          #0e1115;
      }
      .copy {
        position: absolute;
        left: 84px;
        top: 96px;
        width: 620px;
      }
      h1 {
        font-size: 64px;
      }
      .lede {
        font-size: 20px;
      }
      .posters {
        position: absolute;
        right: 70px;
        top: 70px;
        display: flex;
        gap: 22px;
        margin: 0;
        padding: 0;
        transform: rotate(-4deg);
      }
      .posters li {
        width: 170px;
        list-style: none;
      }
      .posters li:nth-child(2) {
        margin-top: 60px;
      }
      .posters li:nth-child(3) {
        margin-top: 20px;
      }
      .posters .lbnf-badge {
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
      }
      .posters .lbnf-badge svg {
        width: 14px;
        height: 14px;
      }
      .cta {
        position: absolute;
        right: 120px;
        bottom: 64px;
        width: 260px;
        transform: rotate(-4deg);
      }
      .cta .lbnf-cta {
        margin: 0;
        filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.6));
      }
      .cta .lbnf-play {
        height: 48px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="copy">
        <div class="eyebrow"><img src="../out/store-icon-128.png" alt="" />Watchlist Bridge</div>
        <h1>Your Netflix list, on your <em>Letterboxd</em> watchlist.</h1>
        <p class="lede">Add it on Netflix, see it on Letterboxd. Play it on Netflix straight from Letterboxd.</p>
      </div>
      <ul class="posters">
        <li class="lbnf-host"><div data-poster="The Long Quiet|A film by June Okafor|0|2"></div><a class="lbnf-badge" data-play></a></li>
        <li class="lbnf-host"><div data-poster="Glass Harbor|A film by Mara Ellison|5|0"></div><a class="lbnf-badge" data-play></a></li>
        <li class="lbnf-host"><div data-poster="Paper Lanterns|A film by Tomás Reyes|8|1"></div><a class="lbnf-badge" data-play></a></li>
      </ul>
      <div class="cta">
        <section class="lbnf-cta"><a class="lbnf-play" data-play><span>Watch on Netflix</span></a></section>
      </div>
    </div>
    <script src="shared.js"></script>
  </body>
</html>
